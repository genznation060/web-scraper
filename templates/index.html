<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Scraper Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        body { background: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .header {
            background: var(--primary-gradient);
            color: white;
            padding: 40px 0;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        }
        .header h1 { font-weight: 700; font-size: 2.5rem; }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }
        .form-control, .form-select {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            padding: 12px 16px;
        }
        .form-control:focus, .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.2);
        }
        .btn-primary {
            background: var(--primary-gradient);
            border: none;
            border-radius: 10px;
            padding: 12px 30px;
            font-weight: 600;
        }
        .btn-primary:disabled { opacity: 0.65; }
        .scraping-status {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #e7f3ff;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        .results-section { display: none; margin-top: 30px; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: white;
            padding: 18px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .stat-number { font-size: 2rem; font-weight: 700; color: #667eea; }
        .stat-label { color: #6c757d; font-size: 0.9rem; }
        .preview-table {
            max-height: 420px;
            overflow: auto;
            border-radius: 10px;
            background: white;
        }
        .preview-table thead { position: sticky; top: 0; background: #667eea; color: white; z-index: 5; }
        .pagination-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }
        .pagination-card {
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 14px;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }
        .pagination-card:hover, .pagination-card.active {
            border-color: #667eea;
            background: #f0f3ff;
        }
        .pagination-card i { font-size: 1.6rem; color: #667eea; }
    </style>
</head>
<body>
    <div class="header text-center">
        <div class="container">
            <h1><i class="fas fa-spider me-3"></i>Web Scraper Pro</h1>
            <p class="mb-0">Scrape websites and export clean CSV data</p>
        </div>
    </div>

    <div class="container pb-5">
        <div class="card p-4">
            <h4 class="mb-4"><i class="fas fa-cog me-2"></i>Scraping Configuration</h4>

            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label fw-bold">Target URL</label>
                    <input type="url" id="targetUrl" class="form-control"
                           placeholder="https://example.com/products" value="">
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-bold">Max Pages</label>
                    <input type="number" id="maxPages" class="form-control" value="3" min="1" max="20">
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-bold">Pagination Type</label>
                    <select id="paginationType" class="form-select">
                        <option value="url">Standard (Next Page links)</option>
                        <option value="load_more">Load More Button</option>
                        <option value="infinite">Infinite Scroll</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-bold">Custom Selector (Optional)</label>
                    <input type="text" id="customSelector" class="form-control"
                           placeholder=".product-item, article, .post, .card">
                </div>
            </div>

            <div class="mt-3">
                <small class="text-muted">
                    <strong>Tip:</strong> For product pages use a selector like <code>.product</code>, <code>.item</code>, <code>article</code> or <code>.card</code>
                </small>
            </div>

            <div class="mt-4 text-center">
                <button id="scrapeBtn" class="btn btn-primary btn-lg px-5">
                    <i class="fas fa-play me-2"></i>Start Scraping
                </button>
            </div>

            <!-- Status -->
            <div id="scrapingStatus" class="scraping-status">
                <div class="d-flex justify-content-between mb-2">
                    <span id="statusMessage">Starting...</span>
                    <span id="progressText">0%</span>
                </div>
                <div class="progress" style="height: 8px;">
                    <div id="progressBar" class="progress-bar" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Results -->
        <div id="resultsSection" class="results-section">
            <div class="card p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="mb-0"><i class="fas fa-table me-2"></i>Results</h4>
                    <button id="downloadBtn" class="btn btn-success">
                        <i class="fas fa-download me-2"></i>Download CSV
                    </button>
                </div>

                <div id="statsGrid" class="stats-grid"></div>
                <div id="previewContainer" class="preview-table"></div>
            </div>
        </div>
    </div>

    <script>
        let currentCsvData = '';

        document.getElementById('scrapeBtn').addEventListener('click', async function () {
            const url = document.getElementById('targetUrl').value.trim();
            const maxPages = document.getElementById('maxPages').value;
            const paginationType = document.getElementById('paginationType').value;
            const customSelector = document.getElementById('customSelector').value.trim();

            if (!url) {
                alert('Please enter a valid URL');
                return;
            }

            const statusDiv = document.getElementById('scrapingStatus');
            statusDiv.style.display = 'block';
            document.getElementById('progressBar').style.width = '15%';
            document.getElementById('progressText').textContent = '15%';
            document.getElementById('statusMessage').textContent = 'Scraping in progress...';

            this.disabled = true;
            this.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Scraping...';

            // Hide previous results
            document.getElementById('resultsSection').style.display = 'none';

            try {
                const response = await fetch('/scrape', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        url: url,
                        max_pages: maxPages,
                        pagination_type: paginationType,
                        custom_selector: customSelector
                    })
                });

                const data = await response.json();

                if (!response.ok || data.error) {
                    alert('Error: ' + (data.error || 'Something went wrong'));
                    return;
                }

                // Success
                document.getElementById('progressBar').style.width = '100%';
                document.getElementById('progressText').textContent = '100%';
                document.getElementById('statusMessage').textContent = data.message || 'Done!';

                currentCsvData = data.csv_data || '';
                displayResults(data);

            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                this.disabled = false;
                this.innerHTML = '<i class="fas fa-play me-2"></i>Start Scraping';
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 2500);
            }
        });

        function displayResults(data) {
            const section = document.getElementById('resultsSection');
            section.style.display = 'block';

            // Stats
            document.getElementById('statsGrid').innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${data.data_count}</div>
                    <div class="stat-label">Total Items</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${data.columns.length}</div>
                    <div class="stat-label">Columns</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${data.preview ? data.preview.length : 0}</div>
                    <div class="stat-label">Preview Rows</div>
                </div>
            `;

            // Preview table
            const preview = data.preview || [];
            if (preview.length > 0) {
                const columns = data.columns && data.columns.length
                    ? data.columns
                    : Object.keys(preview[0]);

                let html = '<table class="table table-striped table-hover table-sm mb-0"><thead><tr>';
                columns.forEach(col => html += `<th>${col}</th>`);
                html += '</tr></thead><tbody>';

                preview.forEach(row => {
                    html += '<tr>';
                    columns.forEach(col => {
                        let val = row[col] !== undefined && row[col] !== null ? String(row[col]) : '';
                        if (val.length > 60) val = val.substring(0, 60) + '...';
                        html += `<td>${val}</td>`;
                    });
                    html += '</tr>';
                });
                html += '</tbody></table>';
                document.getElementById('previewContainer').innerHTML = html;
            } else {
                document.getElementById('previewContainer').innerHTML = '<p class="p-3 text-muted">No preview available</p>';
            }
        }

        // Download CSV
        document.getElementById('downloadBtn').addEventListener('click', function () {
            if (!currentCsvData) {
                alert('No data to download');
                return;
            }
            const blob = new Blob([currentCsvData], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `scraped_data_${Date.now()}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
